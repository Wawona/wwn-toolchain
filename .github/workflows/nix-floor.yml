name: Nix floor

on:
  push:
    branches: [development, master, main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix-floor.yml"
      - ".github/scripts/verify-apple-objc-deployment.py"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix-floor.yml"
      - ".github/scripts/verify-apple-objc-deployment.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  objc-floor:
    name: Apple ObjC deployment floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 ./.github/scripts/verify-apple-objc-deployment.py
  report:
    name: Nix floor
    uses: Wawona/Wawona/.github/workflows/nix-repo-floor.yml@development
